<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="35%" stop-color="#eab308" />
      <stop offset="70%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#eab308" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Escudo de Fondo -->
  <path d="M50,4 C76,4 92,16 92,38 C92,68 50,96 50,96 C50,96 8,68 8,38 C8,16 24,4 50,4 Z" 
        fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="3.5" filter="url(#glow)"/>

  <!-- Estrella Superior -->
  <polygon points="50,14 52.8,21.8 61,22.2 54.8,27 57,35 50,30.5 43,35 45.2,27 39,22.2 47.2,21.8" 
           fill="url(#goldGrad)"/>

  <!-- Copa de Campeonato / Trofeo -->
  <rect x="42" y="72" width="16" height="4" rx="1.5" fill="url(#goldGrad)"/>
  <rect x="38" y="75" width="24" height="4" rx="2" fill="url(#goldGrad)"/>
  <path d="M47,59 L53,59 L51.5,72 L48.5,72 Z" fill="url(#goldGrad)"/>
  <path d="M36,36 L64,36 C64,36 65,54 50,58 C35,54 36,36 36,36 Z" fill="url(#goldGrad)"/>
  <path d="M36,40 C28,40 28,50 38,52 M64,40 C72,40 72,50 62,52" 
        fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>

  <!-- Pelota central pequeña -->
  <circle cx="50" cy="46" r="4.5" fill="#ffffff" />
  <polygon points="50,43 52.5,45 51.5,47.8 48.5,47.8 47.5,45" fill="#0f172a"/>
</svg>