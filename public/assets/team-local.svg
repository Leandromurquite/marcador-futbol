<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGradLocal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
    <linearGradient id="goldBorderLocal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glowLocal" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284c7" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Escudo Base -->
  <path d="M 100 10 L 180 30 L 170 150 C 155 195 100 230 100 230 C 100 230 45 195 30 150 L 20 30 Z" 
        fill="url(#shieldGradLocal)" stroke="url(#goldBorderLocal)" stroke-width="6" filter="url(#glowLocal)"/>
  
  <!-- Franjas decorativas internas -->
  <path d="M 100 20 L 100 225 C 100 225 145 192 160 148 L 170 34 Z" fill="rgba(255,255,255,0.12)"/>
  
