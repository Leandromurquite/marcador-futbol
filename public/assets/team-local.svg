  <circle cx="100" cy="115" r="42" fill="#ffffff" stroke="#082f49" stroke-width="3"/>
  <!-- Pentágono central -->
  <polygon points="100,95 119,109 112,130 88,130 81,109" fill="#082f49"/>
  <!-- Líneas del balón -->
  <line x1="100" y1="95" x2="100" y2="74" stroke="#082f49" stroke-width="3"/>
  <line x1="119" y1="109" x2="137" y2="102" stroke="#082f49" stroke-width="3"/>
  <line x1="112" y1="130" x2="126" y2="148" stroke="#082f49" stroke-width="3"/>
  <line x1="88" y1="130" x2="74" y2="148" stroke="#082f49" stroke-width="3"/>
  <line x1="81" y1="109" x2="63" y2="102" stroke="#082f49" stroke-width="3"/>

  <!-- Estrellas superiores -->
  <polygon points="100,45 103,54 112,54 105,60 108,69 100,63 92,69 95,60 88,54 97,54" fill="#38bdf8"/>
  <polygon points="70,52 72,59 79,59 74,64 76,71 70,66 64,71 66,64 61,59 68,59" fill="#38bdf8"/>
  <polygon points="130,52 132,59 139,59 134,64 136,71 130,66 124,71 126,64 121,59 128,59" fill="#38bdf8"/>
  
  <!-- Letras CLUB -->
  <text x="100" y="190" font-family="'Montserrat', sans-serif" font-weight="900" font-size="22" fill="#ffffff" text-anchor="middle" letter-spacing="3">LOCAL</text>
